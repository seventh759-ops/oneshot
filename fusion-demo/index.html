<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フュージョン演出</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* レイアウト：上に主人公の二つ名と技名の予告、下にスキルを選ぶ棚。撃つと全画面の演出に切り替わる */
:root {
  color-scheme: dark;
  --void: #07060c;
  --panel: #110f1a;
  --line: #2b2740;
  --text: #ece8f6;
  --muted: #8e88a8;
  --violet: #9b7bff;
  --gold: #e9c46a;
  --blood: #e0435f;
  --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--void); color: var(--text); font-family: var(--gothic); }
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

main {
  max-width: 760px; margin: 0 auto; display: grid; gap: 18px;
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: grid; gap: 4px; }
.eyebrow { font-size: 11px; letter-spacing: .3em; color: var(--muted); }
h1 { margin: 0; font-family: var(--mincho); font-weight: 800; font-size: 26px; letter-spacing: .08em; }
#title-line { font-size: 13px; color: var(--muted); }
#title-line b { color: var(--violet); font-weight: 700; }

/* 技名の予告 */
#preview {
  border: 1px solid var(--line); border-radius: 6px; padding: 18px 16px; text-align: center;
  background: radial-gradient(ellipse at 50% 0%, #1d1733 0, transparent 70%), var(--panel);
}
#preview .ruby { font-size: 12px; letter-spacing: .25em; color: var(--violet); min-height: 1.4em; overflow-wrap: anywhere; }
#preview .kanji { font-family: var(--mincho); font-weight: 800; font-size: clamp(28px, 7vw, 44px); letter-spacing: .12em; min-height: 1.3em; overflow-wrap: anywhere; }
#preview .el { font-size: 11px; letter-spacing: .3em; margin-top: 6px; }
#preview .empty { color: var(--muted); font-size: 14px; }

#slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot {
  min-height: 62px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--muted);
  display: grid; place-items: center; text-align: center; padding: 6px; cursor: pointer; font-size: 13px;
}
.slot.filled { border-style: solid; border-color: #4a3f78; color: var(--text); background: #171328; }
.slot small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .1em; }
@media (max-width: 480px) { #slots { grid-template-columns: repeat(2, 1fr); } }

.shelf { display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.tab.on { border-color: var(--violet); color: var(--text); background: #1d1733; }
#skills { display: flex; flex-wrap: wrap; gap: 6px; }
.skill {
  border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  display: grid; text-align: left;
}
.skill small { font-size: 10px; color: var(--muted); }
.skill:hover:not(:disabled) { border-color: var(--violet); }
.skill:disabled { opacity: .35; cursor: default; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.controls { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row label { font-size: 12px; color: var(--muted); letter-spacing: .1em; margin-right: 4px; }
.pick { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.pick.on { color: var(--text); border-color: var(--text); }
.pick.on[data-v="perfect"] { color: var(--gold); border-color: var(--gold); }
.pick.on[data-v="death"] { color: var(--blood); border-color: var(--blood); }
#fire {
  margin-left: auto; background: var(--text); color: var(--void); border: 0; border-radius: 4px; padding: 10px 28px;
  font-family: var(--mincho); font-weight: 800; font-size: 18px; letter-spacing: .2em; cursor: pointer;
}
#fire:disabled { opacity: .3; cursor: default; }

/* ── 全画面の演出 ── */
#stage {
  position: fixed; inset: 0; z-index: 20; background: #000; overflow: hidden; display: grid; place-items: center;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
#fx, #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage.shake { animation: shake .5s; }
@keyframes shake { 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 3px); } }
.layer { position: relative; z-index: 1; text-align: center; display: grid; gap: 14px; justify-items: center; width: 100%; max-width: 720px; align-self: end; margin-bottom: max(6vh, 32px); }
.layer::before { content: ""; position: absolute; z-index: -1; inset: -48px -50vw -40px; background: linear-gradient(to bottom, transparent, rgba(4,3,10,.82) 30%, rgba(4,3,10,.9) 70%, transparent); pointer-events: none; }
#line { text-shadow: 0 0 12px #000, 0 0 4px #000; }
#line { font-family: var(--mincho); font-size: clamp(16px, 4vw, 22px); letter-spacing: .1em; min-height: 1.6em; color: var(--text); opacity: .9; }
#who { font-size: 11px; letter-spacing: .4em; color: var(--muted); }
#name { display: grid; gap: 6px; }
#name .ruby { font-size: clamp(11px, 2.6vw, 15px); letter-spacing: .35em; color: var(--accent, var(--violet)); text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: 0; overflow-wrap: anywhere; }
#name .kanji { font-family: var(--mincho); font-weight: 800; font-size: clamp(36px, 11vw, 92px); letter-spacing: .1em; line-height: 1.1; opacity: 0; overflow-wrap: anywhere; color: #fff; -webkit-text-stroke: 1px rgba(0,0,0,.6); paint-order: stroke fill; text-shadow: 0 2px 6px #000, 0 0 2px #000, 0 0 28px var(--accent, var(--violet)); }
#name.glitch .kanji { animation: glitch .9s steps(2) 3; }
@keyframes glitch { 0%, 100% { transform: none; text-shadow: 0 0 28px var(--accent); } 33% { transform: translateX(-6px); text-shadow: 8px 0 #7fe8ff, -8px 0 #d79bff; } 66% { transform: translateX(5px); text-shadow: -6px 0 #7fe8ff, 6px 0 #d79bff; } }
#name.show .ruby { animation: ruby-in .5s ease-out forwards; }
#name.show .kanji { animation: slam .45s cubic-bezier(.2,1.6,.4,1) .35s forwards; }
@keyframes ruby-in { from { opacity: 0; letter-spacing: 1.2em; } to { opacity: 1; letter-spacing: .35em; } }
@keyframes slam { from { opacity: 0; transform: scale(2.4); filter: blur(10px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
#name.true .kanji { color: var(--gold); text-shadow: 0 0 36px #e9c46aaa; }
#name.true .ruby { color: var(--gold); }
#name.fade { transition: opacity .6s; opacity: 0; }
#tag { font-family: var(--mincho); font-size: 14px; letter-spacing: .5em; color: var(--gold); min-height: 1.4em; }
#result { display: grid; gap: 10px; justify-items: center; }
#result .big { font-family: var(--mincho); font-weight: 800; font-size: clamp(40px, 12vw, 96px); letter-spacing: .2em; }
#result .big.perfect { color: var(--gold); text-shadow: 0 0 40px #e9c46a99; }
#result .big.death { color: var(--blood); }
#result .sub { font-family: var(--mincho); font-size: 16px; letter-spacing: .08em; }
#result .aside { font-size: 12px; color: var(--muted); }
#result .goddess { font-size: 14px; color: var(--text); max-width: 34em; line-height: 1.8; }
#result .goddess::before { content: "女神「"; color: var(--muted); }
#result .goddess::after { content: "」"; color: var(--muted); }
#close { margin-top: 10px; background: transparent; border: 1px solid var(--muted); color: var(--text); border-radius: 4px; padding: 8px 20px; cursor: pointer; }
#flash { position: absolute; inset: 0; z-index: 2; background: #fff; opacity: 0; pointer-events: none; }
#flash.on { animation: flash .5s forwards; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
#vignette { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 40%, #5a0010cc 100%); transition: opacity .8s; }
#vignette.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">ONE SHOT ／ FUSION SKILL</div>
    <h1>フュージョン演出</h1>
    <div id="title-line"></div>
  </header>

  <section id="preview" aria-live="polite">
    <div class="ruby" id="pv-ruby"></div>
    <div class="kanji" id="pv-kanji"></div>
    <div class="el" id="pv-el"></div>
  </section>

  <div id="slots"></div>

  <section class="shelf">
    <div class="tabs" id="tabs"></div>
    <div id="skills"></div>
    <p class="hint" id="shelf-hint"></p>
  </section>

  <section class="controls">
    <div class="row">
      <label>二つ名</label>
      <span id="titles"></span>
    </div>
    <div class="row">
      <label>結末</label>
      <button class="pick" data-v="win" type="button">撃破</button>
      <button class="pick" data-v="perfect" type="button">極</button>
      <button class="pick" data-v="death" type="button">死亡</button>
      <button class="pick" data-v="random" type="button">運命に任せる</button>
      <button id="fire" type="button">撃つ</button>
    </div>
  </section>
</main>

<div id="stage" hidden>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div class="layer">
    <div id="who"></div>
    <div id="line"></div>
    <div id="name"><div class="ruby"></div><div class="kanji"></div></div>
    <div id="tag"></div>
    <div id="result"></div>
  </div>
</div>

<script>
// ── スキル（企画書「スキル一覧（案）」の漢字とルビ） ──
//   pos: 冠=0 / 接頭=1 / 語幹=2 / 接尾=3
const G = {
  crown: { label: '補助（冠）', pos: 0 },
  prefix: { label: '属性（接頭）', pos: 1 },
  stem: { label: '形（語幹）', pos: 2 },
  suffix: { label: '理（接尾）', pos: 3 },
};
const S = (group, name, kanji, ruby) => ({ group, name, kanji, ruby, pos: G[group].pos });
const SKILLS = [
  S('crown', '鑑定', '理解', 'アナライズ'), S('crown', '直感', '開眼', 'インサイト'), S('crown', '予知', '未来視', 'フォアサイト'),
  S('crown', '隠密', '影歩', 'ステルス'), S('crown', '加速', '瞬迅', 'アクセル'), S('crown', '溜め', '終焉', 'ファイナル'),
  S('crown', '二重詠唱', '双', 'ダブル'), S('crown', '狂化', '狂咆', 'バーサーク'), S('crown', '挑発', '挑', 'プロヴォーク'),
  S('crown', '擬態', '化', 'ミミック'), S('crown', '模倣', '写', 'コピー'), S('crown', '増幅', '超', 'オーバー'),
  S('prefix', '炎魔法', '紅蓮', 'クリムゾン'), S('prefix', '氷魔法', '氷華', 'フロスト'), S('prefix', '雷魔法', '雷霆', 'ライトニング'),
  S('prefix', '水魔法', '蒼流', 'アクア'), S('prefix', '風魔法', '疾風', 'ゲイル'), S('prefix', '土魔法', '岩砕', 'ガイア'),
  S('prefix', '光魔法', '聖光', 'ホーリー'), S('prefix', '闇魔法', '冥闇', 'アビス'), S('prefix', '毒術', '毒牙', 'ヴェノム'),
  S('prefix', '音波', '響', 'レゾナンス'), S('prefix', '重力操作', '重星', 'グラビティ'), S('prefix', '時操作', '刻', 'クロノス'),
  S('prefix', '空間操作', '虚空', 'ヴォイド'), S('prefix', '生命魔法', '翠', 'ヴァーダント'), S('prefix', '鉄操作', '鋼', 'スティール'),
  S('prefix', '爆炎', '爆', 'ブラスト'), S('prefix', '樹木魔法', '森羅', 'フォレスト'), S('prefix', '酸', '溶解', 'コロージョン'),
  S('prefix', '星魔法', '流星', 'メテオ'), S('prefix', '幻術', '幻影', 'ファントム'), S('prefix', '血魔法', '紅血', 'ブラッド'),
  S('stem', '剣技', '斬', 'スラッシュ'), S('stem', '槍術', '穿', 'ピアス'), S('stem', '拳法', '砕', 'ブレイク'),
  S('stem', '弓術', '射', 'シュート'), S('stem', '魔導砲', '砲', 'キャノン'), S('stem', '嵐', '嵐', 'テンペスト'),
  S('stem', '連撃', '乱舞', 'ダンス'), S('stem', '投擲', '投', 'スロー'), S('stem', '鎖術', '鎖', 'チェイン'),
  S('stem', '罠術', '罠', 'トラップ'), S('stem', '兜割り', '天墜', 'フォール'), S('stem', '地走り', '地走', 'グラウンド'),
  S('stem', '追尾弾', '追', 'ホーミング'), S('stem', '跳弾', '跳', 'リコシェ'), S('stem', '召喚', '喚', 'サモン'),
  S('stem', '分身', '影', 'シャドウ'), S('stem', '一点集中', '極点', 'シンギュラリティ'), S('stem', '全方位', '輪', 'サークル'),
  S('stem', '突進', '轟', 'チャージ'), S('stem', '鞭術', '鞭', 'ウィップ'),
  S('suffix', '貫通術', '徹', 'ペネトレイト'), S('suffix', '斬鉄', '斬鉄', 'アーマーブレイク'), S('suffix', '封印術', '封', 'シール'),
  S('suffix', '浄化', '祓', 'パージ'), S('suffix', '即死術', '断命', 'デス'), S('suffix', '石化', '石化', 'ペトリファイ'),
  S('suffix', '麻痺', '痺', 'パラライズ'), S('suffix', '吸収', '喰', 'ドレイン'), S('suffix', '反転', '反', 'リバース'),
  S('suffix', '解呪', '破', 'ディスペル'), S('suffix', '透過', '透', 'フェイズ'), S('suffix', '急所突き', '穿心', 'クリティカル'),
  S('suffix', '焦刃', '灼', 'バーン'), S('suffix', '爆散', '爆散', 'バースト'), S('suffix', '崩壊', '崩', 'コラプス'),
  S('suffix', '消滅', '消', 'イレイズ'), S('suffix', '魅了', '魅', 'チャーム'), S('suffix', '威圧', '覇', 'ドミネイト'),
  S('suffix', '魂断ち', '魂断', 'ソウルエンド'), S('suffix', '連鎖', '連', 'リンク'),
];
// 常時スキル → 主人公の二つ名
const TITLES = [
  { name: 'なし', kanji: '', ruby: '' },
  { name: '魔力無限', kanji: '無限', ruby: 'インフィニティ' },
  { name: '言語理解', kanji: '万言', ruby: 'ポリグロット' },
  { name: '経験値倍化', kanji: '百戦', ruby: 'ヴェテラン' },
  { name: '幸運', kanji: '吉兆', ruby: 'フォーチュン' },
  { name: 'アイテムボックス', kanji: '無尽蔵', ruby: 'ストレージ' },
];

// ── 決め台詞（技にいちばん多く入っているグループで選ぶ） ──
const LINES = {
  crown: ['……すでに、視えている。', '影は語らず。ただ、結果だけを置いていく。'],
  prefix: ['世界の理よ――我が掌に、跪け。', '燃えろ。凍てつけ。……どちらでも同じことだ。'],
  stem: ['一歩も動くな。――終わらせる。', '抜いた時には、もう終わっている。'],
  suffix: ['抗うな。それが、お前の運命だ。', '名も残さず、消えるがいい。'],
};
const TRUE_LINE = '……見せてやろう。この一撃の、真の名を。';
const DEATH_LINES = [
  ['……ふっ。計算どおりだ。', '（計算外）'],
  ['これも、想定の内……', '（想定外）'],
  ['我が一撃に、悔いは――', '（ある）'],
  ['……なるほど。そう来たか。', '（何も見えていなかった）'],
];
const GODDESS = [
  'はい、おかえりなさい。今の技名、もう一回言ってみます？',
  '格好は満点でした。結果は零点ですけど。',
  '死に際の台詞まで用意してたんですか。戻しておきますね。',
  'その技、名前はとても強そうでしたよ。',
];
const WIN_LINES = ['――終わりだ。', '……振り返る必要もない。', '影に還れ。'];

// ── 状態 ──
let slots = [null, null, null, null];
let tab = 'prefix';
let ending = 'win';
let title = 0;
let busy = false;
let count = 0; // 撃った回数（台詞の回し用）

const $ = (id) => document.getElementById(id);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? ms * 0.3 : ms));

// 技名の組み立て：冠・接頭・語幹・接尾の順。同じ位置は置いた順。語幹がなければ「撃（ストライク）」
function fusionName(list) {
  const parts = list.filter(Boolean).map((k, i) => ({ ...SKILLS[k], i }));
  if (!parts.length) return null;
  if (!parts.some((p) => p.pos === 2)) parts.push({ kanji: '撃', ruby: 'ストライク', pos: 2, i: 99 });
  parts.sort((a, b) => a.pos - b.pos || a.i - b.i);
  return { kanji: parts.map((p) => p.kanji).join(''), ruby: parts.map((p) => p.ruby).join('・') };
}

function titleText() {
  const t = TITLES[title];
  return t.kanji ? { kanji: `${t.kanji}の影`, ruby: `${t.ruby}・シャドウ` } : null;
}

function render() {
  const t = titleText();
  $('title-line').innerHTML = t ? `二つ名：<b>${t.kanji}</b>（${t.ruby}）` : '二つ名：なし（常時スキルを選ぶと付く）';

  const n = fusionName(slots);
  const th = themeOf(slots);
  $('pv-ruby').textContent = n ? n.ruby : '';
  $('pv-el').textContent = n ? `属性：${th.name}` : '';
  $('pv-el').style.color = th.col;
  $('pv-kanji').innerHTML = n ? n.kanji : '<span class="empty">スキルを選ぶと、技名がここに組み上がる</span>';

  $('slots').innerHTML = '';
  slots.forEach((k, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'slot' + (k !== null ? ' filled' : '');
    b.innerHTML = k !== null ? `${SKILLS[k].name}<small>${G[SKILLS[k].group].label}</small>` : `枠${i + 1}`;
    b.disabled = busy || k === null;
    b.onclick = () => { slots[i] = null; Sound.play('tick'); render(); };
    $('slots').appendChild(b);
  });

  $('tabs').innerHTML = '';
  Object.entries(G).forEach(([key, g]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (key === tab ? ' on' : '');
    b.textContent = g.label;
    b.onclick = () => { tab = key; render(); };
    $('tabs').appendChild(b);
  });

  $('skills').innerHTML = '';
  const full = !slots.includes(null);
  SKILLS.forEach((s, k) => {
    if (s.group !== tab) return;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'skill';
    b.innerHTML = `${s.name}<small>${s.kanji}／${s.ruby}</small>`;
    b.disabled = busy || full || slots.includes(k);
    b.onclick = () => { slots[slots.indexOf(null)] = k; Sound.play('tick'); render(); };
    $('skills').appendChild(b);
  });
  $('shelf-hint').textContent = full ? '枠がいっぱい。枠に触れると外せる。' : '最大4つまで。置いた順も技名に効く。';

  $('titles').innerHTML = '';
  TITLES.forEach((t, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick' + (i === title ? ' on' : '');
    b.textContent = t.name;
    b.onclick = () => { title = i; render(); };
    $('titles').appendChild(b);
  });

  document.querySelectorAll('.pick[data-v]').forEach((b) => b.classList.toggle('on', b.dataset.v === ending));
  $('fire').disabled = busy || !n;
}

// ── 属性ごとの色・エフェクト・音 ──
//   技に入っている最初の属性（接頭）で決まる。属性がなければ「無」
const THEMES = {
  none: { name: '無', col: '#9b7bff', col2: '#ffffff', fx: 'burst' },

    const [ex, ey] = strokePartial(g, pl.pts, 1 - Math.pow(1 - k, 2));
    g.fillStyle = hexA('#ffffff', 0.9 * after);
    g.beginPath(); g.arc(ex, ey, pl.w * 1.4, 0, Math.PI * 2); g.fill();
  }
  g.shadowBlur = 0;
  // 足元の光だまり
  const pool = g.createRadialGradient(cx, base, 0, cx, base, 90 * u);
  pool.addColorStop(0, hexA(col, 0.6 * ease * after)); pool.addColorStop(1, hexA(col, 0));
  g.fillStyle = pool; g.beginPath(); g.ellipse(cx, base, 90 * u, 14 * u, 0, 0, Math.PI * 2); g.fill();

  // 人物（暗闇から浮かび上がる）
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = Math.min(1, ease * 1.3) * (struck < 0 ? 1 : Math.max(0.25, after));
  drawFigure(g, cx - 14 * u, base, u, col, ease, now, struck);
  g.globalAlpha = 1;

  // 頭上の光の輪（後半に現れ、ゆっくり脈打つ）
  const halo = Math.max(0, Math.min(1, (p - 0.5) / 0.35)) * after;
  if (halo > 0) {
    g.globalCompositeOperation = 'lighter';
    const pulse = 1 + Math.sin(now / 300) * 0.03;
    g.shadowColor = col; g.shadowBlur = 24 * dpr();
    const hc = scene.gold ? '#e9c46a' : col;
    g.shadowColor = hc;
    g.strokeStyle = hexA(hc, 0.9 * halo); g.lineWidth = 3 * dpr();
    g.beginPath(); g.ellipse(cx - 14 * u, base - 124 * u, 34 * u * pulse, 4 * u * pulse, 0, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = hexA('#ffffff', 0.7 * halo); g.lineWidth = 1.2 * dpr();
    g.beginPath(); g.ellipse(cx - 14 * u, base - 124 * u, 34 * u * pulse, 4 * u * pulse, 0, 0, Math.PI * 2); g.stroke();
    g.shadowBlur = 0;
  }
  // 足元の霧
  g.globalCompositeOperation = 'lighter';
  for (const m of scene.mist) {
    m.x += m.v;
    const mg = g.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    mg.addColorStop(0, hexA('#e8e0ff', 0.16 * ease * Math.max(after, 0.4))); mg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mg; g.beginPath(); g.arc(m.x, m.y, m.r, 0, Math.PI * 2); g.fill();
  }
  // 放つ瞬間：白く弾ける
  drawSlash(g, cx - 14 * u, base, u, col, struck);
  if (struck >= SWING && struck < SWING + 0.6) {
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = `rgba(255,255,255,${0.7 * (1 - (struck - SWING) / 0.6)})`;
    g.fillRect(0, 0, W, H);
  }
  g.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawScene);
}

// 中心へ吸い込まれる粒子（溜め）
function gather(col, n = 60) {
  const { W, H, cx, cy } = center();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = Math.max(W, H) * (0.4 + Math.random() * 0.3), life = 50 + Math.random() * 30;
    const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
    add({ x, y, vx: (cx - x) / life, vy: (cy - y) / life, life, col });
  }
}
// 中心から弾ける粒子
function burst(col, n = 160, speed = 14, extra = {}) {
  const { cx, cy } = center();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (Math.random() * speed + 2) * dpr();
    add({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 40 + Math.random() * 50, s: (1 + Math.random() * 3) * dpr(), col, ...extra });
  }
}
function ring(col, extra = {}) { fx.rings.push({ r: 10, v: 26 * dpr(), life: 30, max: 30, col, ...extra }); }
const rnd = (a, b) => a + Math.random() * (b - a);

// ── 演出 ──
function majorGroup(list) {
  const cnt = {};
  list.filter((k) => k !== null).forEach((k) => { cnt[SKILLS[k].group] = (cnt[SKILLS[k].group] || 0) + 1; });
  return Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
}

async function typeLine(text) {
  $('line').textContent = '';
  for (let i = 0; i < text.length; i++) {
    $('line').textContent = text.slice(0, i + 1);
    if (i % 2 === 0) Sound.play('type');
    await wait(55);
  }
}

function showName(n, isTrue) {
  const el = $('name');
  el.className = '';
  el.querySelector('.ruby').textContent = n.ruby;
  el.querySelector('.kanji').textContent = n.kanji;
  void el.offsetWidth;
  el.className = 'show' + (isTrue ? ' true' : '');
}

async function fire() {
  if (busy) return;
  Sound.unlock();
  busy = true;
  render();
  const out = ending === 'random' ? ['win', 'perfect', 'death'][Math.floor(Math.random() * 3)] : ending;
  const n = fusionName(slots);
  const t = titleText();
  const th = themeOf(slots);
  count++;

  // 舞台を整える
  $('stage').hidden = false;
  $('stage').className = '';
  sizeCanvas();
  fx.parts = []; fx.rings = []; fx.run = true;
  requestAnimationFrame(loop);
  $('line').textContent = '';
  $('tag').textContent = '';
  $('result').innerHTML = '';
  $('name').className = '';
  $('vignette').className = '';
  $('stage').style.setProperty('--accent', th.col);
  $('who').textContent = t ? `${t.kanji}（${t.ruby}）` : '';
  startScene(th.col);

  // 一. 静寂と決め台詞
  Sound.play('drone');
  await wait(500);
  const pool = LINES[majorGroup(slots)];
  await typeLine(pool[count % pool.length]);
  gather(th.col);
  await wait(900);

  // 二. 技名を叫ぶ
  showName(n, false);
  Sound.play('shout');
  setTimeout(() => { Sound.play('impact'); ring(th.col); }, reduced ? 100 : 380);
  await wait(1500);

  // 極：真名解放
  if (out === 'perfect') {
    $('name').classList.add('fade');
    Sound.play('hush');
    await wait(700);
    await typeLine(TRUE_LINE);
    await wait(500);
    $('tag').textContent = '真 名 解 放';
    Sound.play('bell');
    await wait(900);
    showName({ kanji: `${n.kanji}・零`, ruby: `${n.ruby}・ゼロ` }, true);
    Sound.play('impact');
    scene.gold = performance.now(); // 真名解放：属性の色はそのままに、光輪と刃に金が差す
    gather('#e9c46a', 120);
    await wait(1600);
  }

  // 三. 放つ
  $('line').textContent = '';
  // 剣を振り下ろしてから、白く弾ける
  scene.strikeAt = performance.now();
  await wait(SWING * 1000);
  $('flash').className = '';
  void $('flash').offsetWidth;
  $('flash').className = 'on';
  $('stage').classList.add('shake');
  Sound.play('strike');
  Sound.play('el_' + th.key);
  ring(out === 'perfect' ? '#e9c46a' : '#ffffff');
  FX[th.fx](th);
  await wait(600);
  $('name').classList.add('fade');
  $('tag').textContent = '';

  // 四. 結末
  if (out === 'death') {
    await wait(900);
    $('vignette').className = 'on';
    const [line, aside] = DEATH_LINES[count % DEATH_LINES.length];
    await typeLine(line);
    await wait(500);
    Sound.play('death');
    $('result').innerHTML = `<div class="aside">${aside}</div><div class="big death">死亡</div>`
      + `<div class="goddess">${GODDESS[count % GODDESS.length]}</div><button id="close" type="button">戦いの前に戻る</button>`;
  } else {
    burst(out === 'perfect' ? '#e9c46a' : th.col, out === 'perfect' ? 260 : 100);
    Sound.play(out === 'perfect' ? 'perfect' : 'win');
    await wait(900);
    await typeLine(WIN_LINES[count % WIN_LINES.length]);
    await wait(300);
    $('result').innerHTML = out === 'perfect'
      ? '<div class="big perfect">極</div><div class="sub">寸分の狂いもない、真の一撃。</div><button id="close" type="button">戻る</button>'
      : '<div class="big">撃破</div><button id="close" type="button">戻る</button>';
  }
  $('close').onclick = () => { fx.run = false; stopScene(); $('stage').hidden = true; busy = false; render(); };
  $('close').focus();
}

// ── 効果音（Web Audio で合成） ──
// 音はいったん止めている。true に戻すと鳴る
const SOUND_ON = false;
const Sound = (() => {
  let ctx = null, master = null, verb = null;
  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5;
      // 全体をまとめるコンプレッサー（重い音を重ねても割れにくくする）
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master.connect(comp); comp.connect(ctx.destination);
      // 映画館のような長い残響：減衰するノイズをインパルスにする
      const len = ctx.sampleRate * 3.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
      verb = ctx.createConvolver(); verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.55;
      verb.connect(wet); wet.connect(master);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const tone = (type, f, t, a, peak, d, f2) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + a + d + 0.05);
  };
  const noise = (t, d, peak, type, f0, f1) => {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * (d + 0.1)), ctx.sampleRate), x = buf.getChannelData(0);
    for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  };
  // 出口：そのまま＋残響へ送る
  const out = (node, send = 0.4) => {
    node.connect(master);
    if (verb && send) { const g = ctx.createGain(); g.gain.value = send; node.connect(g); g.connect(verb); }
  };
  // 金管：ずらした鋸波2本ずつを、開いて閉じるローパスに通す
  const brass = (t, freqs, a, hold, rel, peak, open = 2400, send = 0.5) => {
    const end = t + a + hold + rel;
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 0.8;
    f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(open, t + a); f.frequency.exponentialRampToValueAtTime(220, end);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, end);
    f.connect(g); out(g, send);
    for (const fr of freqs) for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
      o.connect(f); o.start(t); o.stop(end + 0.05);
    }
  };
  // 歪ませた低音のブーム
  const boom = (t, f0, f1, d, peak) => {
    const o = ctx.createOscillator(), sh = ctx.createWaveShaper(), g = ctx.createGain();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3); }
    sh.curve = curve;
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(sh); sh.connect(g); out(g, 0.25); o.start(t); o.stop(t + d + 0.05);
  };
  // ティンパニ：音程が少し落ちる低い打撃
  const timpani = (t, f, peak = 0.6) => {
    tone('sine', f * 1.15, t, 0.004, peak, 1.4, f);
    noise(t, 0.12, peak * 0.4, 'lowpass', 900, 200);
  };
  // 合唱のような響き：鋸波を母音の帯域に絞る
  const choir = (t, freqs, a, d, peak) => {
    for (const formant of [700, 1150]) {
      const f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'bandpass'; f.frequency.value = formant; f.Q.value = 6;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
      f.connect(g); out(g, 0.8);
      for (const fr of freqs) for (const det of [-10, 0, 10]) {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
        o.connect(f); o.start(t); o.stop(t + a + d + 0.05);
      }
    }
  };
  // 金属の響き：倍音が整数倍にならない高い音を、少しずつずらして重ねる（刃の鳴り、銅鑼）
  const metal = (t, base, ratios, d, peak, send = 0.6) => {
    ratios.forEach((r, i) => {
      for (const det of [-4, 4]) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = base * r; o.detune.value = det;
        const dd = d * (1 - i * 0.08);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak / (i + 1), t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dd);
        o.connect(g); out(g, send); o.start(t); o.stop(t + dd + 0.05);
      }
    });
  };
  // 弦楽器のような和音：鋸波を何本もずらして重ね、柔らかく絞って、ゆっくり立ち上げる
  const pad = (t, freqs, a, hold, rel, peak, cutoff = 1600, send = 0.8) => {
    const end = t + a + hold + rel;
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 0.3; f.frequency.setValueAtTime(cutoff * 0.4, t); f.frequency.linearRampToValueAtTime(cutoff, t + a);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, end);
    f.connect(g); out(g, send);
    for (const fr of freqs) for (const det of [-14, -6, 0, 6, 14]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det;
      o.connect(f); o.start(t); o.stop(end + 0.05);
    }
  };
  // きらめき：高い正弦波をゆらしながら散らす
  const shimmer = (t, freqs, d, peak) => {
    freqs.forEach((fr, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      o.type = 'sine'; o.frequency.value = fr;
      lfo.frequency.value = 4 + i; lg.gain.value = peak * 0.4; lfo.connect(lg); lg.connect(g.gain);
      const st = t + i * 0.18;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(peak, st + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      o.connect(g); out(g, 1); o.start(st); o.stop(st + d + 0.05); lfo.start(st); lfo.stop(st + d + 0.05);
    });
  };
  // 細かく弾ける音（火の粉、電気）
  const crackle = (t, d, n, f0, f1, peak) => {
    for (let i = 0; i < n; i++) noise(t + Math.random() * d, 0.02, peak * (0.4 + Math.random() * 0.6), 'bandpass', f0, f1);
  };
  const EL = {
    none: () => {},
    fire: (t) => { noise(t, 1.4, 0.55, 'lowpass', 900, 120); crackle(t, 1.2, 26, 3000, 2000, 0.25); },
    ice: (t) => { [2093, 2637, 3136, 4186, 5274].forEach((f, i) => tone('sine', f, t + i * 0.06, 0.002, 0.06, 1.4)); noise(t, 0.08, 0.5, 'highpass', 5000, 8000); },
    thunder: (t) => { crackle(t, 0.5, 30, 2500, 5000, 0.35); noise(t + 0.15, 2.2, 0.45, 'lowpass', 400, 60); },
    water: (t) => { noise(t, 0.9, 0.7, 'bandpass', 1400, 300); for (let i = 0; i < 8; i++) tone('sine', 500 + Math.random() * 600, t + 0.2 + i * 0.08, 0.005, 0.11, 0.08, 1400); },
    wind: (t) => { noise(t, 1.3, 0.4, 'bandpass', 500, 2600); noise(t + 0.4, 1.0, 0.25, 'bandpass', 2600, 500); },
    earth: (t) => { boom(t, 45, 25, 2.4, 0.6); noise(t, 0.25, 0.5, 'bandpass', 900, 300); crackle(t + 0.2, 1.0, 14, 600, 300, 0.3); },
    light: (t) => { shimmer(t, [1568, 2093, 2637, 3136], 2.2, 0.06); metal(t, 1046, [1, 2.76, 5.4], 2.4, 0.07, 1); },
    dark: (t) => { tone('sine', 38, t, 0.4, 0.5, 2.6, 30); pad(t, [55, 58.3, 77.8], 0.3, 0.6, 1.8, 0.03, 500, 0.8); },
    poison: (t) => { for (let i = 0; i < 14; i++) tone('sine', 300 + Math.random() * 500, t + Math.random() * 1.2, 0.005, 0.1, 0.12, 900); noise(t, 0.8, 0.15, 'highpass', 3000, 6000); },
    sound: (t) => { tone('sine', 440, t, 0.01, 0.18, 1.4, 1760); tone('sine', 660, t + 0.1, 0.01, 0.12, 1.4, 2640); },
    time: (t) => { for (let i = 0; i < 6; i++) tone('square', 2400, t + i * 0.13, 0.001, 0.12, 0.03); noise(t + 0.8, 0.6, 0.45, 'bandpass', 300, 3000); },
    life: (t) => { [784, 880, 1047, 1175, 1319].forEach((f, i) => tone('triangle', f, t + i * 0.09, 0.005, 0.11, 1.2)); },
    steel: (t) => { metal(t, 620, [1, 2.4, 3.9, 5.6], 2.2, 0.12, 0.6); crackle(t, 0.4, 12, 6000, 4000, 0.25); },
    star: (t) => { tone('sine', 3200, t, 0.01, 0.08, 0.9, 260); boom(t + 0.8, 70, 30, 1.6, 0.5); },
    illusion: (t) => { [880, 885, 1320, 1327].forEach((f) => tone('sine', f, t, 0.3, 0.08, 1.8)); },
    blood: (t) => { tone('sine', 70, t, 0.005, 0.6, 0.25, 50); tone('sine', 70, t + 0.32, 0.005, 0.45, 0.3, 45); },
  };
  const S = {
    tick: (t) => tone('sine', 1400, t, 0.002, 0.08, 0.05),
    type: (t) => tone('sine', 2200, t, 0.002, 0.02, 0.03),
    drone: (t) => { tone('sawtooth', 55, t, 0.6, 0.06, 2.4); tone('sine', 110, t, 0.6, 0.05, 2.4); },
    shout: (t) => { noise(t, 0.5, 0.25, 'bandpass', 300, 3000); tone('sawtooth', 110, t, 0.05, 0.1, 0.5, 440); },
    impact: (t) => { tone('sine', 90, t, 0.005, 0.9, 0.9, 35); noise(t, 0.35, 0.4, 'lowpass', 2000, 200); },
    hush: (t) => noise(t, 0.6, 0.06, 'highpass', 6000, 2000),
    bell: (t) => [988, 2470, 4200].forEach((f, i) => tone('sine', f, t, 0.003, 0.18 / (i + 1), 2.4)),
    // 放つ：乾いた打撃 → 刃が空気を裂く → 金属の鳴りが長く残る。低音は短く締める
    strike: (t) => {
      noise(t, 0.012, 0.9, 'highpass', 6000, 9000);
      noise(t, 0.14, 1.0, 'bandpass', 9000, 1800);
      metal(t + 0.01, 1580, [2, 2.76, 3.52, 4.31, 5.4], 1.8, 0.16, 0.7);
      tone('sine', 5200, t + 0.01, 0.002, 0.05, 0.9, 4800);
      boom(t, 90, 38, 0.45, 0.55);
    },
    // 撃破：静かに。遠くで一度だけ鳴る低い音と、深い残響の余韻
    win: (t) => {
      tone('sine', 73.4, t, 0.02, 0.35, 2.2, 70);
      pad(t + 0.1, [146.8, 220], 1.2, 0.4, 2.4, 0.03, 900, 1);
      metal(t + 0.3, 880, [1, 2.76, 5.4], 3, 0.015, 1);
    },
    // 極：低い銅鑼と沈む低音から、弦の和音が4オクターブに広がり、高音のきらめきが降る
    perfect: (t) => {
      boom(t, 55, 28, 2.6, 0.5);
      metal(t, 82, [1, 1.48, 1.93, 2.6, 3.3, 4.1, 5.2], 5, 0.12, 0.9);
      pad(t + 0.15, [73.4, 110, 146.8, 185, 220, 293.7, 370, 440], 1.6, 1.4, 3, 0.022, 2000);
      shimmer(t + 1.2, [1174.7, 1480, 1760, 2349.3], 3.2, 0.025);
    },
    // 死亡：予告編のような重く沈む金管（ブォーン）と、不協和の残り香
    death: (t) => {
      boom(t, 48, 30, 3, 0.7);
      brass(t, [55, 58.3, 82.4], 0.08, 1.1, 2.2, 0.2, 900, 0.7);
      brass(t + 0.05, [110, 116.5], 0.08, 1.0, 2.0, 0.07, 700, 0.7);
    },
  };
  return {
    unlock() { if (SOUND_ON) ensure(); },
    play(name) {
      if (!SOUND_ON || !ensure()) return;
      const fn = name.startsWith('el_') ? EL[name.slice(3)] : S[name];
      try { fn(ctx.currentTime + 0.01); } catch { /* 音が出なくても続行 */ }
    },
  };
})();

document.querySelectorAll('.pick[data-v]').forEach((b) => { b.onclick = () => { ending = b.dataset.v; render(); }; });
$('fire').onclick = fire;
window.addEventListener('resize', () => { if (!$('stage').hidden) sizeCanvas(); });

// 最初の一例：紅蓮・穿・封
slots = [12, 34, 55, null];
render();
</script>
