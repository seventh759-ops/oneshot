<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE SHOT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header>
  <h1>ONE SHOT</h1>
  <nav id="stage-nav"></nav>
</header>

<main>
  <section id="enemy-area">
    <div id="enemy-name"></div>
    <div id="enemy-sprite"></div>
    <div id="enemy-stats"></div>
    <div id="hint"></div>
    <div id="damage-pop"></div>
  </section>

  <section id="build-area">
    <h2>ビルド <span class="sub">左から順に処理 / 枠をクリックで外す</span></h2>
    <div id="slots"></div>
    <div id="log"></div>
    <div class="actions">
      <button id="reset-btn" class="ghost">リセット</button>
      <button id="attack-btn">一撃！</button>
    </div>
  </section>

  <section id="parts-area">
    <h2>パーツ <span class="sub">クリックで空き枠へ / 各1回まで</span></h2>
    <div id="parts"></div>
  </section>
</main>

<div id="modal" hidden>
  <div class="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <button id="modal-btn"></button>
  </div>
</div>

<script src="src/logic.js"></script>
<script src="src/main.js"></script>
</body>
</html>
